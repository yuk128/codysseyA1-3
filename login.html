<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>말동무 — 로그인</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="glyph">✎</div>
      <h1>말동무</h1>
      <p>짧은 글을 남기면, AI가 다정하게 반응해줘요.<br />팔로워가 없어도 괜찮아요.</p>
      <button class="google-btn" id="googleLoginBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 5.1 29.6 3 24 3c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 36.1 27 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.9 40.5 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.6 5.4C41.5 35.9 45 30.4 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
        구글로 로그인
      </button>
      <p class="login-note">로그인 시 최초 1회 프로필이 자동으로 생성돼요.</p>
    </div>
  </div>

  <script type="module">
    import { signInWithGoogle, redirectIfLoggedIn } from "./js/auth.js";
    redirectIfLoggedIn();
    document.getElementById("googleLoginBtn").addEventListener("click", signInWithGoogle);
  </script>
</body>
</html>
