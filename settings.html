<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>말동무 — 설정</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="wordmark"><span class="glyph">✎</span><span class="name">말동무</span></div>
      <nav class="nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          홈
        </a>
        <a class="nav-item" href="mypage.html">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="2"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          마이페이지
        </a>
        <a class="nav-item active" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          설정
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="avatar-mini" id="sidebarAvatar">?</div>
        <div class="who">
          <span class="nick" id="sidebarNick">불러오는 중…</span>
          <span class="sub">기록 중</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>설정</h1>
        <p>프로필과 화면 모드를 관리해요.</p>
      </div>

      <div class="settings-list">
        <div class="settings-row">
          <div>
            <div class="label">닉네임</div>
            <div class="desc">피드에 표시되는 이름이에요.</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="text" id="nickInput" placeholder="닉네임" />
            <button class="btn primary" id="saveNickBtn">저장</button>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <div class="label">다크 모드</div>
            <div class="desc">눈이 편한 밤의 일기장 톤 (기본값)</div>
          </div>
          <div class="toggle on" id="themeToggle"></div>
        </div>

        <div class="settings-row">
          <div>
            <div class="label">로그아웃</div>
            <div class="desc">이 기기에서 로그아웃해요.</div>
          </div>
          <button class="btn danger" id="logoutBtn">로그아웃</button>
        </div>
      </div>

      <p id="saveMsg" style="margin-top:14px; font-size:13px; opacity:0; transition:opacity .2s;"></p>
    </main>

    <aside class="rail"></aside>
  </div>

  <nav class="tabbar">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      홈
    </a>
    <a href="mypage.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="2"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      마이
    </a>
    <a class="active" href="settings.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V20a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.6V4a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.6 1H20a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      설정
    </a>
  </nav>

  <script type="module" src="js/settings.js"></script>
</body>
</html>
