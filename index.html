      <div class="sidebar-footer">
        <div class="avatar-mini" id="sidebarAvatar">?</div>
        <div class="who">
          <span class="nick" id="sidebarNick">불러오는 중…</span>
          <span class="sub">기록 중</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>오늘의 기록</h1>
        <p>짧게 남겨도 괜찮아요. 말동무가 곧 반응해줄 거예요.</p>
      </div>

      <div class="composer">
        <textarea id="postInput" maxlength="600" placeholder="오늘 하루는 어땠나요?"></textarea>
        <div class="composer-footer">
          <span class="char-count" id="charCount">0 / 500</span>
          <button class="post-btn" id="postBtn" disabled>게시하기</button>
        </div>
        <p class="inline-error" id="inlineError"></p>
      </div>

      <div class="feed" id="feed">
        <div class="empty-state"><div class="glyph">✎</div><p>불러오는 중…</p></div>
      </div>
    </main>

    <aside class="rail">
      <div class="rail-card">
        <h3>말동무는 이렇게 반응해요</h3>
        <p class="rail-tip">글을 올리면 AI가 다정한 톤으로 짧은 댓글을 남겨요. 팔로워가 없어도 늘 첫 반응이 도착해요.</p>
      </div>
      <div class="rail-card">
        <h3>기록 팁</h3>
        <p class="rail-tip">완벽한 문장이 아니어도 괜찮아요. 한 줄짜리 감상도 좋은 기록이에요.</p>
